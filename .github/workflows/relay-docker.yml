name: Build and publish CoveLounge pin relay

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./relay
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/covelounge-pin-server:latest


  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Deploy to Google VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/covelounge-pin
            docker compose pull
            docker compose up -d
