name: Build and publish CoveLounge pin relay

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./relay
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/covelounge-pin-server:latest
