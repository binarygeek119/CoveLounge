version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/relay"
    schedule:
      interval: "weekly"
    labels:
      - "relay"
  - package-ecosystem: "npm"
    directory: "/relay"
    schedule:
      interval: "weekly"
    labels:
      - "relay"
